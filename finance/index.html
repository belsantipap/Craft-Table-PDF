 ['BDP','Best Demonstrated Production อัตราผลิตมาตรฐานของ Kiln'],
 ['CAPEX','รายจ่ายลงทุนที่บันทึกเป็นสินทรัพย์ ≥ USD 20,000 (หรือ 5,000) และใช้ > 1 ปี'],
 ['CAPEX 6 Types','ขยาย · ปลอดภัย · สิ่งแวดล้อม · คุณภาพ · ประหยัด (Rationalization) · แทนของเดิม (Replacement)'],
 ['Construction in Progress','CAPEX ที่เริ่มแล้วแต่ยังไม่เสร็จ ยังไม่หักค่าเสื่อม'],
 ['Depreciation','ค่าเสื่อมราคา (non-cash)'],
 ['Master budget','Operating budgets + Financial budgets'],
 ['Production budget','ผลิต = ขายที่คาด + สต็อกปลายงวด − สต็อกต้นงวด'],
 ['Operating profit','กำไรจากการดำเนินงาน ต้นทุนผลิตเกือบทั้งหมดอยู่เหนือเส้นนี้']
];

const PLAN = [
 ['สัปดาห์ 1','บทที่ 0, 1, 2','ภาพรวม · ตะกร้า 3 ชนิด · การเทตะกร้า'],
 ['สัปดาห์ 2','บทที่ 3, 4, 5','ผลไม้ · 5 แว่น · บันไดต้นทุน'],
 ['สัปดาห์ 3','บทที่ 6, 7, 8','Volume & factor · Cost per ton · พลังงาน'],
 ['สัปดาห์ 4','บทที่ 9, 10, 11','OEE · Maintenance vs CAPEX · Budget'],
 ['สัปดาห์ 5','ทบทวน + Final exam','ทวนบัตรคำ แล้วสอบรวมให้ได้ ≥ 80%']
];

/* =========================================================
   STATE
   ========================================================= */
const KEY='basic-finance-share-v1';
let S={passed:{},best:{}};
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&typeof p==='object'){S.passed=p.passed||{};S.best=p.best||{};}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const PASS=0.8;
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* =========================================================
   NAV + PROGRESS
   ========================================================= */
function progress(){
  const done=CH.filter(c=>S.passed[c.id]).length;
  const fin=S.passed.final?1:0;
  const tot=CH.length+1;
  $('#barFill').style.width=Math.round((done+fin)/tot*100)+'%';
  $('#progTxt').textContent=`ผ่านแล้ว ${done}/${CH.length} บท`+(fin?' · Final ✓':'');
}
function renderNav(cur){
  let h=`<a href="#home" class="${cur==='home'?'on':''}"><span class="n">⌂</span><span>หน้าแรก & แผนเรียน</span></a>`;
  h+=`<div class="grp">บทเรียน</div>`;
  CH.forEach((c,i)=>{h+=`<a href="#${c.id}" class="${cur===c.id?'on':''} ${S.passed[c.id]?'done':''}"><span class="n">${S.passed[c.id]?'✓':i}</span><span>${esc(c.title)}</span></a>`;});
  h+=`<div class="grp">ทบทวน</div>`;
  h+=`<a href="#glossary" class="${cur==='glossary'?'on':''}"><span class="n">Aa</span><span>บัตรคำศัพท์ (${GLOSS.length} คำ)</span></a>`;
  h+=`<a href="#final" class="${cur==='final'?'on':''} ${S.passed.final?'done':''}"><span class="n">${S.passed.final?'✓':'★'}</span><span>Final exam (สอบรวม)</span></a>`;
  $('#side').innerHTML=h;
}

/* =========================================================
   VIEWS
   ========================================================= */
function viewHome(){
  const done=CH.filter(c=>S.passed[c.id]).length;
  let tiles=CH.map((c,i)=>{const b=S.best[c.id];const st=S.passed[c.id]?(b?`ผ่านแล้ว · ${b}%`:'ผ่านแล้ว'):(b!=null?`คะแนนล่าสุดดีสุด ${b}% (ยังไม่ถึง 80%)`:`~${c.min} นาที · ${c.quiz.length} ข้อ`);
    return `<a class="tile ${S.passed[c.id]?'done':''}" href="#${c.id}"><div class="no">บทที่ ${i}</div><div class="tt">${esc(c.title)}</div><div class="st">${st}</div></a>`;}).join('');
  $('#view').innerHTML=`
  <div class="kicker">ปูพื้น Finance สำหรับฝ่ายผลิต (โรงงานปูนซีเมนต์)</div>
  <h1>เรียนการเงินโรงงาน ฝั่งผลิต</h1>
  <p class="lead">12 บท จากเอกสารอบรม <i>Basic Finance for cement manufacturing</i> เน้นฝั่งผลิต แต่ละบทมีแบบทดสอบหลังเรียน ผ่านที่ 80% แล้วจบด้วยการสอบรวม</p>
  <div class="card"><b>ความคืบหน้า:</b> ผ่าน ${done} จาก ${CH.length} บท ${S.passed.final?'· Final exam ผ่านแล้ว 🎉':''}
  <div style="font-size:14px;color:var(--mute);margin-top:4px">ความคืบหน้าบันทึกไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ถ้าเปิดจากเครื่องอื่นจะเริ่มนับใหม่ — ใช้ "ย้ายความคืบหน้า" ด้านล่างเพื่อยกมา</div></div>

  <details class="card" id="syncBox"><summary style="cursor:pointer;font-weight:700">🔄 ย้ายความคืบหน้าข้ามเครื่อง / ข้ามลิงก์</summary>
  <p style="font-size:15px;color:var(--ink2)">แต่ละที่ที่เปิด (ไฟล์ในเครื่อง, ลิงก์ GitHub, มือถือ) เก็บความคืบหน้าแยกกัน ใช้รหัสนี้ย้ายไปอีกที่ได้ ระบบจะรวมกับของเดิม ไม่ลบของที่มีอยู่</p>
  <b>1) รหัสของที่นี่</b> — คัดลอกไปวางในอีกที่
  <textarea id="codeOut" readonly rows="2" style="width:100%;font:13px Consolas,monospace;margin:6px 0;padding:8px;border:1.5px solid var(--line);border-radius:9px"></textarea>
  <button class="btn ghost" id="copyCode">คัดลอกรหัส</button> <span id="copyMsg" style="font-size:14px;color:var(--ok)"></span>
  <p style="margin-top:14px"><b>2) วางรหัสจากอีกที่</b></p>
  <textarea id="codeIn" rows="2" placeholder="วางรหัสที่ขึ้นต้นด้วย BF1-" style="width:100%;font:13px Consolas,monospace;margin:6px 0;padding:8px;border:1.5px solid var(--line);border-radius:9px"></textarea>
  <button class="btn" id="importBtn">นำเข้า</button> <span id="importMsg" style="font-size:14px"></span>
  <p style="margin-top:14px"><b>3) หรือติ๊กเองว่าผ่านบทไหนแล้ว</b> <span style="font-size:14px;color:var(--mute)">(ใช้กับไฟล์เก่าที่ยังไม่มีปุ่มรหัส)</span></p>
  <div id="manualTicks" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 12px;font-size:15px"></div>
  </details>

  <h2>แผนเรียน (≈ 3 บท/สัปดาห์ บทละ 25–40 นาที)</h2>
  <div class="tbl"><table class="plan"><tr><th>ช่วง</th><th>เรียน</th><th>หัวข้อ</th></tr>
  ${PLAN.map(p=>`<tr><td>${p[0]}</td><td><b>${p[1]}</b></td><td>${p[2]}</td></tr>`).join('')}</table></div>
  <p style="font-size:14.5px;color:var(--ink2)">ถ้าอยากเร็วกว่านี้: วันละ 1 บท จะจบทั้งหมดใน ~2 สัปดาห์</p>

  <h2>วิธีเรียนให้จำได้จริง</h2>
  <div class="card"><ol>
  <li><b>อ่านบท</b> ดูกล่องสีเหลือง 🧺 (ภาพตะกร้า) และกล่องสีแดง 🧠 (ท่องจำ) เป็นพิเศษ</li>
  <li><b>ทำแบบทดสอบท้ายบททันที</b> ข้อที่ผิดให้อ่านคำอธิบาย แล้วทำใหม่จนได้ ≥ 80%</li>
  <li><b>วันถัดไป</b> ก่อนเริ่มบทใหม่ เปิด <a href="#glossary">บัตรคำ</a> ทวน 5 นาที (การทวนซ้ำข้ามวันช่วยให้จำได้นานกว่าอ่านรวดเดียว)</li>
  <li>ลองหยิบไฟล์งานจริงของตัวเอง (เช่น ไฟล์งบ, รายงานต้นทุนต่อตัน) มาชี้ว่าแต่ละบรรทัดคือ "ตะกร้าไหน + ผลไม้อะไร"</li>
  </ol></div>

  <h2>บทเรียนทั้งหมด</h2>
  <div class="grid">${tiles}
  <a class="tile ${S.passed.final?'done':''}" href="#final"><div class="no">สอบรวม</div><div class="tt">Final exam</div><div class="st">${S.passed.final?'ผ่านแล้ว'+(S.best.final?' · '+S.best.final+'%':''):'25 ข้อสุ่มจากทุกบท'}</div></a></div>
  `;
  wireSync();
}

function exportCode(){const p=Object.keys(S.passed).filter(k=>S.passed[k]);return 'BF1-'+btoa(JSON.stringify({p:p,b:S.best}));}
function wireSync(){
  const out=document.getElementById('codeOut'); if(!out) return;
  out.value=exportCode();
  document.getElementById('copyCode').addEventListener('click',async()=>{
    out.select(); let ok=false;
    try{await navigator.clipboard.writeText(out.value);ok=true;}catch(e){try{ok=document.execCommand('copy');}catch(e2){}}
    document.getElementById('copyMsg').textContent=ok?'คัดลอกแล้ว ✓':'คัดลอกไม่ได้ ให้กดค้างที่ช่องแล้วคัดลอกเอง';
  });
  document.getElementById('importBtn').addEventListener('click',()=>{
    const m=document.getElementById('importMsg');
    try{
      const t=document.getElementById('codeIn').value.trim();
      if(!t.startsWith('BF1-')) throw 0;
      const o=JSON.parse(atob(t.slice(4)));
      const ids=new Set(CH.map(c=>c.id).concat(['final']));
      let n=0;
      (o.p||[]).forEach(k=>{if(ids.has(k)&&!S.passed[k]){S.passed[k]=true;n++;}});
      for(const k in (o.b||{})){ if(ids.has(k)) S.best[k]=Math.max(S.best[k]||0,Math.round(+o.b[k])||0); }
      save(); progress(); renderNav('home');
      m.style.color='var(--ok)'; m.textContent='นำเข้าแล้ว ✓ เพิ่ม '+n+' บท';
      setTimeout(viewHome,900);
    }catch(e){m.style.color='var(--bad)';m.textContent='รหัสไม่ถูกต้อง ลองคัดลอกใหม่ให้ครบ';}
  });
  const box=document.getElementById('manualTicks');
  box.innerHTML=CH.map((c,i)=>`<label><input type="checkbox" data-id="${c.id}" ${S.passed[c.id]?'checked':''}> บทที่ ${i} ${esc(c.title)}</label>`).join('')
    +`<label><input type="checkbox" data-id="final" ${S.passed.final?'checked':''}> Final exam</label>`;
  box.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{
    if(cb.checked) S.passed[cb.dataset.id]=true; else delete S.passed[cb.dataset.id];
    save(); progress(); renderNav('home'); out.value=exportCode();
  }));
}

function viewChapter(i){
  const c=CH[i];
  const prev=i>0?`<a class="btn ghost" href="#${CH[i-1].id}">← บทที่ ${i-1}</a>`:`<a class="btn ghost" href="#home">← หน้าแรก</a>`;
  const next=i<CH.length-1?`<a class="btn" href="#${CH[i+1].id}">บทที่ ${i+1} →</a>`:`<a class="btn" href="#final">ไป Final exam →</a>`;
  $('#view').innerHTML=`
  <div class="kicker">บทที่ ${i}</div>
  <h1>${esc(c.title)}</h1>
  <div class="meta">ใช้เวลาประมาณ ${c.min} นาที · แบบทดสอบ ${c.quiz.length} ข้อ ${S.passed[c.id]?' · <b style="color:var(--ok)">ผ่านแล้ว'+(S.best[c.id]?' ('+S.best[c.id]+'%)':'')+'</b>':''}</div>
  ${c.body}
  <div class="quiz" id="quiz"></div>
  <div class="navrow">${prev}${next}</div>`;
  if(c.id==='c5') drawWaterfall();
  renderQuiz($('#quiz'),c.quiz,c.id,`แบบทดสอบหลังเรียน บทที่ ${i}`);
}

function drawWaterfall(){
  const el=document.getElementById('wf1'); if(!el) return;
  const max=86700;
  const rows=[['Variable cash cost',0,42500,'#245c9e'],['Fixed cash cost',42500,33100,'#8a7356'],['= Cash cost',0,75600,'#d8232a'],['Provisions',75600,100,'#9a948b'],['Depreciation',75700,11000,'#9a948b'],['= COGP',0,86700,'#a8151b']];
  el.innerHTML=rows.map(r=>`<div class="row"><div class="lab">${r[0]}</div><div class="track"><div class="seg" style="left:${r[1]/max*100}%;width:${Math.max(r[2]/max*100,0.6)}%;background:${r[3]}"></div></div><div class="val">${r[2].toLocaleString('en-US')}</div></div>`).join('');
}

function renderQuiz(root,qs,key,title){
  const items=qs.map(q=>{const idx=shuffle(q.o.map((_,k)=>k));return {q,idx};});
  let answered=0,correct=0;
  root.innerHTML=`<div class="qhead"><h2 style="margin:10px 0">${esc(title)}</h2><span class="meta" id="qc_${key}" style="margin:0">ตอบแล้ว 0/${items.length}</span></div>
  <p style="color:var(--ink2);font-size:15px">เลือกคำตอบได้ข้อละครั้ง ระบบจะเฉลยพร้อมเหตุผลทันที · ผ่านเมื่อได้ ≥ ${Math.round(PASS*100)}%</p>
  ${items.map((it,n)=>`<div class="q" data-n="${n}"><div class="qt"><span class="qn">${n+1}.</span>${esc(it.q.q)}</div>
    ${it.idx.map(k=>`<button class="opt" data-k="${k}">${esc(it.q.o[k])}</button>`).join('')}
    <div class="exp"></div></div>`).join('')}
  <div id="qr_${key}"></div>`;
  root.querySelectorAll('.q').forEach(qe=>{
    const it=items[+qe.dataset.n];
    qe.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const k=+b.dataset.k, ok=k===it.q.a;
      qe.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.k===it.q.a) x.classList.add('right');});
      if(!ok) b.classList.add('wrong');
      const ex=qe.querySelector('.exp');
      ex.innerHTML=(ok?'<b class="ok">✓ ถูกต้อง</b> ':'<b class="no">✗ ยังไม่ใช่</b> ')+esc(it.q.e);
      ex.classList.add('show');
      answered++; if(ok) correct++;
      document.getElementById('qc_'+key).textContent=`ตอบแล้ว ${answered}/${items.length} · ถูก ${correct}`;
      if(answered===items.length) finish();
    }));
  });
  function finish(){
    const pct=Math.round(correct/items.length*100);
    const pass=correct/items.length>=PASS;
    S.best[key]=Math.max(S.best[key]||0,pct);
    if(pass) S.passed[key]=true;
    save(); progress(); renderNav(location.hash.slice(1)||'home');
    const box=document.getElementById('qr_'+key);
    box.innerHTML=`<div class="result ${pass?'pass':'fail'}"><b>${pass?'🎉 ผ่าน!':'เกือบแล้ว'}</b> ได้ ${correct}/${items.length} (${pct}%) ${pass?'':'— ต้องได้ ≥ 80% ลองอ่านคำอธิบายข้อที่ผิด แล้วทำใหม่'}
      <div class="toggle-row"><button class="btn ghost" id="rt_${key}">ทำใหม่ (สลับตัวเลือก)</button></div></div>`;
    document.getElementById('rt_'+key).addEventListener('click',()=>{renderQuiz(root,key==='final'?pickFinal():qs,key,title);root.scrollIntoView({behavior:'smooth'});});
  }
}

function pickFinal(){
  const pool=[];CH.forEach(c=>c.quiz.forEach(q=>pool.push(q)));
  const main=shuffle(pool).slice(0,19);
  return shuffle(main.concat(shuffle(FINAL_EXTRA).slice(0,6)));
}
function viewFinal(){
  const ready=CH.filter(c=>S.passed[c.id]).length;
  $('#view').innerHTML=`<div class="kicker">สอบรวม</div><h1>Final exam</h1>
  <p class="lead">25 ข้อ สุ่มจากทุกบท + โจทย์ผสมหลายบท ผ่านที่ 80%</p>
  ${ready<CH.length?`<div class="box warn">ตอนนี้ผ่านแล้ว ${ready}/${CH.length} บท ทำได้เลย แต่แนะนำให้ผ่านทุกบทก่อน</div>`:''}
  <div class="quiz" id="quiz" style="border-top:0;margin-top:0"></div>`;
  renderQuiz($('#quiz'),pickFinal(),'final','Final exam · 25 ข้อ');
}

function viewGloss(){
  $('#view').innerHTML=`<div class="kicker">ทบทวน</div><h1>บัตรคำศัพท์</h1>
  <p class="lead">กดที่บัตรเพื่อดูความหมาย ลองนึกคำตอบก่อนเปิด</p>
  <input class="gsearch" id="gs" placeholder="ค้นหาคำ เช่น TSR, ตะกร้า, CAPEX">
  <div class="toggle-row"><button class="btn ghost" id="gOpen">เปิดทั้งหมด</button><button class="btn ghost" id="gClose">ปิดทั้งหมด</button><button class="btn ghost" id="gShuf">สลับลำดับ</button></div>
  <div class="flash" id="fl"></div>`;
  let list=GLOSS.slice();
  const draw=()=>{const q=($('#gs').value||'').toLowerCase();
    $('#fl').innerHTML=list.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q)).map(g=>`<div class="fc"><div class="term">${esc(g[0])}</div><div class="mean">${esc(g[1])}</div><div class="hint">แตะเพื่อดูความหมาย</div></div>`).join('')||'<p>ไม่พบคำนี้</p>';
    document.querySelectorAll('.fc').forEach(f=>f.addEventListener('click',()=>f.classList.toggle('open')));};
  $('#gs').addEventListener('input',draw);
  $('#gOpen').addEventListener('click',()=>document.querySelectorAll('.fc').forEach(f=>f.classList.add('open')));
  $('#gClose').addEventListener('click',()=>document.querySelectorAll('.fc').forEach(f=>f.classList.remove('open')));
  $('#gShuf').addEventListener('click',()=>{list=shuffle(list);draw();});
  draw();
}

/* =========================================================
   ROUTER
   ========================================================= */
function route(){
  const h=(location.hash||'#home').slice(1);
  const i=CH.findIndex(c=>c.id===h);
  renderNav(i>=0?h:(['final','glossary'].includes(h)?h:'home'));
  if(i>=0) viewChapter(i);
  else if(h==='final') viewFinal();
  else if(h==='glossary') viewGloss();
  else viewHome();
  progress();
  $('#side').classList.remove('open');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
route();
</script>
